# === font ===
bold_font        auto
bold_italic_font auto
font_family      family="JetBrainsMono Nerd Font Mono"
font_size        16.0
italic_font      auto


# === layouts ===
enabled_layouts                     tall,horizontal,vertical,stack
#   toggle full "terminal" (aligned with aerospace alt+f fullscreen)
map ctrl+shift+f toggle_layout stack
map cmd+f toggle_layout stack
#   search scrollback (moved off cmd+f)
map cmd+/ search_scrollback


# === tabs ===
tab_bar_edge                        top
tab_bar_style                       slant
tab_bar_min_tabs                    1
#   new tab with rename
map ctrl+shift+t combine : new_tab : set_tab_title " "
map cmd+t combine : new_tab : set_tab_title " "
#   rename tab (with clearing current name)
map ctrl+shift+i combine : set_tab_title " " : set_tab_title
map cmd+i combine : set_tab_title " " : set_tab_title
#   focus: relative (aligned with aerospace alt+] / alt+[)
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map cmd+] next_tab
map cmd+[ previous_tab
#   focus: absolute (aligned with aerospace alt+1..9 workspace)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9


# === terminal and shell ===
macos_option_as_alt                 yes
macos_quit_when_last_window_closed  yes
macos_show_window_title_in          none
allow_remote_control                no
confirm_os_window_close             0
enable_audio_bell                   no
hide_window_decorations             yes
shell_integration                   enabled no-title


# === windows ===
window_padding_width                4
#   new window
map ctrl+shift+enter new_window_with_cwd
map cmd+enter new_window_with_cwd
#   focus (aligned with aerospace alt+arrows)
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map cmd+left neighboring_window left
map cmd+right neighboring_window right
map cmd+up neighboring_window up
map cmd+down neighboring_window down
#   move (aligned with aerospace alt+shift+arrows)
map ctrl+shift+alt+left move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up move_window up
map ctrl+shift+alt+down move_window down
map cmd+shift+left move_window left
map cmd+shift+right move_window right
map cmd+shift+up move_window up
map cmd+shift+down move_window down


# tinted theme sets the values in this file to selected theme
include ./tinted-theming.conf
