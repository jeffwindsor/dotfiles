# ── Tinty-managed items ───────────────────────────────────────────────────────

# -- Terminals
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "kitty"
themes-dir = "themes/kitty"
hook = "cp -f %f ~/.config/kitty/tinted-theming.conf && { [ -z \"$KITTY_PID\" ] || kill -USR1 \"$KITTY_PID\"; }"
supported-systems = ["base16", "base24"]

# -- Shell commands (sources the tinted-shell script to recolor the terminal, then generates lsd and yazi themes)
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "shell"
themes-dir = "scripts"
hook = ". %f && bash ~/.config/tinted-theming/tinty/hooks/lsd-colors.sh && bash ~/.config/tinted-theming/tinty/hooks/yazi-flavor.sh"


